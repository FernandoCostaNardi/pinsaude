spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pinsaude
    username: svc_fiscal
    password: ${DB_PASSWORD_FISCAL:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: fiscal
  flyway:
    schemas: fiscal
    default-schema: fiscal
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
server:
  port: 8081
management:
  endpoints:
    web:
      exposure:
        include: health,info
