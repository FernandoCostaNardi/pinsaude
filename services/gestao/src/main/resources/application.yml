spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pinsaude
    username: svc_gestao
    password: ${DB_PASSWORD_GESTAO:local_dev_only}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gestao
  flyway:
    schemas: gestao
    default-schema: gestao
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health,info

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: pinsaude
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

app:
  mail:
    from: noreply@pinsaude.com.br
    from-name: "Pin Saude"
    app-url: ${APP_URL:http://localhost:3000}
