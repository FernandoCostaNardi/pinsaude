spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pinsaude
    username: svc_ledger
    password: ${DB_PASSWORD_LEDGER:ledger_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger
  flyway:
    schemas: ledger
    default-schema: ledger
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2.0
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info
