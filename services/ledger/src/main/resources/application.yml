spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pinsaude
    username: svc_ledger
    password: ${DB_PASSWORD_LEDGER:ledger_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledger
  flyway:
    schemas: ledger
    default-schema: ledger
    enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
server:
  port: 8083
management:
  endpoints:
    web:
      exposure:
        include: health,info
