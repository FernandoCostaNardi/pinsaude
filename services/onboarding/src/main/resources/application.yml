spring:
  config:
    import: "optional:classpath:application-local.yml"
  datasource:
    url: jdbc:postgresql://localhost:5433/pinsaude
    username: svc_onboarding
    password: ${DB_PASSWORD_ONBOARDING:onboarding_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: onboarding
  flyway:
    schemas: onboarding
    default-schema: onboarding
    locations: classpath:db/migration
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8085
  tomcat:
    max-http-form-post-size: 20MB

crypto:
  key: ${CRYPTO_KEY:pinsaude-dev-key-change-in-prod}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:pinsaude-documentos}

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email-from: ${EMAIL_FROM:noreply@pinsaude.com.br}
  convite:
    expiracao-horas: ${CONVITE_EXPIRACAO_HORAS:168}

clicksign:
  enabled: ${CLICKSIGN_ENABLED:false}
  mock.enabled: ${CLICKSIGN_MOCK_ENABLED:true}
  base-url: ${CLICKSIGN_BASE_URL:https://sandbox.clicksign.com}
  access-token: ${CLICKSIGN_ACCESS_TOKEN:}
  template-key: ${CLICKSIGN_TEMPLATE_KEY:}

keycloak:
  admin:
    server-url: ${KEYCLOAK_URL:http://localhost:8080}
    realm: pinsaude
    username: ${KEYCLOAK_ADMIN:admin}
    password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

management:
  endpoints:
    web:
      exposure:
        include: health,info
