spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/pinsaude
    username: svc_onboarding
    password: ${DB_PASSWORD_ONBOARDING:onboarding_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: onboarding
  flyway:
    schemas: onboarding
    default-schema: onboarding
    locations: classpath:db/migration
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/pinsaude
server:
  port: 8085
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

crypto:
  key: ${CRYPTO_KEY:pinsaude-dev-key-change-in-prod}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:pinsaude-documentos}

spring:
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  email-from: ${EMAIL_FROM:noreply@pinsaude.com.br}
  convite:
    expiracao-horas: ${CONVITE_EXPIRACAO_HORAS:168}

clicksign:
  enabled: ${CLICKSIGN_ENABLED:false}
  base-url: ${CLICKSIGN_BASE_URL:https://sandbox.clicksign.com}
  access-token: ${CLICKSIGN_ACCESS_TOKEN:}
  template-key: ${CLICKSIGN_TEMPLATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
