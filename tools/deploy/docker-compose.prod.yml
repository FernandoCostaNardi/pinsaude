# docker-compose de produção — apenas Keycloak e Mailhog
# PostgreSQL NÃO está aqui: usa o PostgreSQL nativo do servidor
# network_mode: host → containers acessam localhost:5432 (PG do host) diretamente
#
# Uso:
#   cd /home/pinsaude/infra
#   docker compose -f docker-compose.prod.yml up -d

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: pinsaude-keycloak
    command: start-dev --import-realm
    network_mode: host
    restart: unless-stopped
    environment:
      KEYCLOAK_ADMIN: ${KC_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASS}
      KC_HTTP_PORT: 8180
      KC_HEALTH_ENABLED: "true"
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://localhost:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASS}
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://212.85.12.228:8443
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-pinsaude.json:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8180 && printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && timeout 3 head -1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: pinsaude-mailhog
    network_mode: host
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: pinsaude-minio
    command: server /data --console-address ":9001"
    network_mode: host
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: pinsaude-rabbitmq
    network_mode: host
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  minio_data:
  rabbitmq_data:
