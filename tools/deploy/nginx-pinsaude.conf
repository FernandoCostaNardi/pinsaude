# Nginx — Pin Saúde
# Porta 80   → redirect HTTPS
# Porta 443  → SPA React + Gateway (/api/)
# Porta 8443 → Keycloak (proxy HTTPS→HTTP interno)

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/pinsaude/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pinsaude/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /home/pinsaude/apps/web/dist;

    location /api/ {
        proxy_pass         http://localhost:8100/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/pinsaude/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/pinsaude/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    proxy_buffer_size       128k;
    proxy_buffers           4 256k;
    proxy_busy_buffers_size 256k;

    location / {
        proxy_pass          http://localhost:8180;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto https;
        proxy_set_header    X-Forwarded-Port  8443;
        proxy_read_timeout  120s;
    }
}
