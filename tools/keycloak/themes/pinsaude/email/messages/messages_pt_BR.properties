# Sobrescreve só as versões HTML dos e-mails nativos do Keycloak usados neste projeto
# (executeActions = "Reenviar Convite"/convite inicial da tela de Usuários,
#  password-reset = "Esqueceu a senha?"/link de primeiro acesso do médico,
#  email-verification = verificação de e-mail) para usar um botão de CTA no lugar do
# link simples, consistente com os e-mails Thymeleaf do onboarding (templates/email/*.html).
# As versões plaintext e os assuntos continuam herdados do tema base (já traduzidos).
executeActionsBodyHtml=<p style="margin:0 0 16px;">Um administrador solicitou que você atualize sua conta <b>{2}</b> com a(s) seguinte(s) etapa(s): {3}. Clique no botão abaixo para iniciar o processo.</p><table cellpadding="0" cellspacing="0" style="margin:0 0 20px;"><tr><td style="background:#02A9F7;border-radius:8px;"><a href="{0}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">Atualizar minha conta &#8594;</a></td></tr></table><p style="margin:0 0 8px;font-size:13px;color:#888;">Este link irá expirar em {4}.</p><p style="margin:0;font-size:13px;color:#888;">Se você não tem conhecimento de que o administrador solicitou isso, basta ignorar esta mensagem e nada será alterado.</p>
passwordResetBodyHtml=<p style="margin:0 0 16px;">Alguém solicitou uma alteração de senha da sua conta <b>{2}</b>. Se foi você, clique no botão abaixo para redefini-la.</p><table cellpadding="0" cellspacing="0" style="margin:0 0 20px;"><tr><td style="background:#02A9F7;border-radius:8px;"><a href="{0}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">Redefinir minha senha &#8594;</a></td></tr></table><p style="margin:0 0 8px;font-size:13px;color:#888;">Este link irá expirar em {3}.</p><p style="margin:0;font-size:13px;color:#888;">Se você não deseja redefinir sua senha, apenas ignore esta mensagem e nada será alterado.</p>
emailVerificationBodyHtml=<p style="margin:0 0 16px;">Alguém criou uma conta <b>{2}</b> com este endereço de e-mail. Se foi você, clique no botão abaixo para verificar o seu endereço de e-mail.</p><table cellpadding="0" cellspacing="0" style="margin:0 0 20px;"><tr><td style="background:#02A9F7;border-radius:8px;"><a href="{0}" style="display:inline-block;padding:14px 32px;font-size:15px;font-weight:700;color:#ffffff;text-decoration:none;border-radius:8px;">Verificar meu e-mail &#8594;</a></td></tr></table><p style="margin:0 0 8px;font-size:13px;color:#888;">Este link irá expirar em {3}.</p><p style="margin:0;font-size:13px;color:#888;">Se não foi você quem criou esta conta, basta ignorar esta mensagem.</p>
