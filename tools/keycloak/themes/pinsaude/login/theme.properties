# Reskin visual do fluxo de login/senha do Keycloak (login, "esqueci minha senha",
# "definir nova senha", verificação de e-mail) pra ficar com a cara do Pin Saúde — o médico não
# deve perceber que está numa ferramenta separada (Keycloak). Herda tudo do tema padrão do
# Keycloak 24 (keycloak.v2, PatternFly 5) e só acrescenta um CSS por cima + troca o logo no
# cabeçalho (ver template.ftl) — nenhuma outra página/lógica é tocada.
parent=keycloak.v2

# Mantém o styles.css original do keycloak.v2 (herdado, resolvido via a cadeia parent) e
# acrescenta o nosso por cima — a ordem importa: o nosso vem depois pra sobrescrever.
styles=css/styles.css css/pinsaude-login.css
